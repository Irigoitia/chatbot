version: "3.1"

rules:

- rule: responder saludo y programar timeout
  steps:
    - intent: saludo
    - action: utter_saludo
    - action: action_programar_timeout

- rule: despedirse cuando el usuario se despide
  steps:
    - intent: despedida
    - action: utter_despedida

- rule: decir que es un bot cuando el usuario lo pregunta
  steps:
    - intent: bot_challenge
    - action: utter_soy_bot

- rule: consultar cotización del dólar
  steps:
    - intent: consultar_dolar
    - action: action_consultar_dolar

- rule: fin conversacion por timeout
  steps:
    - intent: timeout
    - action: action_timeout