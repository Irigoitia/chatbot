version: "3.1"

rules:

- rule: despedirse cuando el usuario se despide
  steps:
    - intent: despedida
    - action: utter_despedida

- rule: decir que es un bot cuando el usuario lo pregunta
  steps:
    - intent: bot_challenge
    - action: utter_soy_bot

- rule: consultar cotización del dólar
  steps:
    - intent: consultar_dolar
    - action: action_consultar_dolar

#- rule: saludar al user
 # steps:
  #  - intent: saludo
   # - action: utter_saludo

- rule: responder chit chat
  steps:
    - intent: chit_chat
    - action: utter_chit_chat

- rule: fallback rule
  steps:
    - intent: nlu_fallback
    - action: action_fallback_contador   


- rule: contactar con una persona
  steps:
     - intent: derivar_a_una_persona
     - action: utter_derivar_a_una_persona     

- rule: router conversación
  steps:
    - action: action_router_conversacion