version: "3.1"

rules:

- rule: despedirse cuando el usuario se despide
  steps:
    - intent: despedida
    - action: utter_despedida

- rule: decir que es un bot cuando el usuario lo pregunta
  steps:
    - intent: bot_challenge
    - action: utter_soy_bot

- rule: saludar al usuario
  steps:
    - intent: saludo
    - action: utter_saludo

- rule: consultar cotización del dólar
  steps:
    - intent: consultar_dolar
    - action: action_consultar_dolar

- rule: comprar dólares
  steps:
    - intent: comprar_dolar
    - action: action_consultar_dolar

- rule: vender dólares
  steps:
    - intent: vender_dolar
    - action: action_consultar_dolar

- rule: comprar dólares con atención humana
  steps:
    - intent: comprar_dolar_persona
    - action: action_consultar_dolar
    - action: utter_derivar_a_una_persona

- rule: vender dólares con atención humana
  steps:
    - intent: vender_dolar_persona
    - action: action_consultar_dolar
    - action: utter_derivar_a_una_persona

- rule: responder chit chat
  steps:
    - intent: chit_chat
    - action: utter_chit_chat

- rule: fallback rule
  steps:
    - intent: nlu_fallback
    - action: action_fallback_contador   


- rule: contactar con una persona
  steps:
     - intent: derivar_a_una_persona
     - action: utter_derivar_a_una_persona

- rule: derivar urgente
  steps:
     - intent: derivar_urgente
     - action: utter_derivar_urgente     

- rule: router conversación
  steps:
    - action: action_router_conversacion

- rule: regla para llamada
  steps:
      - intent: solicitar_llamada
      - action: utter_solicitar_numero    

- rule: debolver el saludo al agradecimiento 
  steps:
      - intent: debolver_saludo_gracias
      - action: utter_debolver_saludos_gracias